<style>
:root{--ink:#23252b;--ink2:#4d5366;--ink3:#7a7f8c;--bone:#faf6ee;--surface:#fffdf8;--border:#e3dcc9;
--navy:#1f2a44;--terra:#B86B4A;--terra-soft:#F2D9CB;--sage:#5F7D55;--sage-soft:#e2ead8;--warn:#C49328;--warn-soft:#FAE7BD;--danger:#B3261E;
--serif:"Fraunces",Georgia,serif;--sans:"Inter Tight","Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
header{background:var(--navy);color:#fff}.hd{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:15px;opacity:.85}.brand b{font-weight:600}
.hd a{color:#cfd8ea;font-size:12.5px;text-decoration:none;margin-left:auto}
.wrap{max-width:1200px;margin:0 auto;padding:20px 20px 80px}
h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:14px 0 2px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:17px;margin:28px 0 8px;border-bottom:1px solid var(--border);padding-bottom:5px}
.meta{color:var(--ink3);font-size:13px}.chip{display:inline-block;white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:1px 10px;font-size:11.5px;margin-right:6px}
.stage{background:var(--terra-soft);border-color:transparent;color:#8E4F32;text-transform:capitalize}
.chip.launched{background:var(--sage-soft);border-color:transparent;color:#3c5a36;font-weight:600}
.launchsec{background:var(--sage-soft);border:1px solid #cbd6bf;border-radius:8px;margin:0 0 16px;padding:0}
.launchsec summary{cursor:pointer;padding:10px 16px;font-weight:600;font-size:13px;color:#3c5a36}
.launchsec .lcount{display:inline-block;background:var(--surface);border-radius:99px;padding:0 9px;margin-left:6px;font-size:12px}
.launchsec table{border-radius:0 0 8px 8px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:7px 10px;border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.ok{color:var(--sage)}.warn{color:var(--warn)}.bad{color:var(--danger);font-weight:600}.dim{color:var(--ink3)}
.mono{font-family:var(--mono);font-size:12px}.done{color:var(--sage)}.overdue{color:var(--danger);font-weight:600}
input#q{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;margin:14px 0}
a{color:#1f2a44}.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.scwrap{overflow-x:auto;padding-bottom:6px}
.scstrip{display:flex;gap:8px;align-items:stretch;min-width:min-content;margin:10px 0 4px}
.sccell{flex:1 0 130px;max-width:190px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px}
.sccell.res{background:var(--warn-soft);border-color:#e8d29a}
.sccell.closed{background:var(--sage-soft);border-color:#cbd6bf}
.scn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;display:flex;justify-content:space-between}
.schead{font-weight:600;margin:3px 0;line-height:1.35}
.schead .hdone{color:var(--sage)}
.scload{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.scend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px}
.decision{border-left:3px solid var(--warn);padding-left:10px;margin:8px 0;font-size:13.5px}.decision .dim{font-size:12px;white-space:pre-line}
.fbtn{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:2px 11px;font-size:11.5px;cursor:pointer;color:var(--ink2)}
.fbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.trigger{border-left:3px solid var(--danger);padding-left:10px;margin:8px 0;font-size:13.5px}.trigger .dim{font-size:12px}
footer{color:var(--ink3);font-size:11.5px;margin-top:40px;font-family:var(--mono)}
</style></head><body>

function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function fmtDate(iso){if(!iso)return"";var p=String(iso).split("-");if(p.length!==3)return iso;return (+p[1])+"/"+(+p[2])+"/"+p[0].slice(2);}
function fmtDelta(days){if(days==null)return"";return days<0?("<span class=bad>"+(-days)+"d over</span>"):("<span class="+(days<=14?"warn":"ok")+">"+days+"d</span>");}
function daysUntil(iso){if(!iso)return null;var a=new Date(DATA.today+"T12:00:00Z"),b=new Date(iso+"T12:00:00Z");return Math.round((b-a)/86400000);}
var host=document.getElementById("app");
var param=new URLSearchParams(location.search).get("g");
function mvmLaunch(g){var l=(g.launches||[]).filter(function(x){return x.app==="MVM";})[0];return l?l.date:null;}
// Fully launched = has launch dates and every one is in the past (chip shows
// immediately). The directory keeps a launched game in the ACTIVE table for
// DATA.graceDays after its last launch before it settles into the section.
function launchedAll(g){var ls=g.launches||[];return ls.length>0&&ls.every(function(l){return l.date&&l.date<DATA.today;});}
var GRACE_CUTOFF=(function(){var d=new Date(DATA.today+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-(DATA.graceDays||7));return d.toISOString().slice(0,10);})();
function launchedSettled(g){var ls=g.launches||[];return ls.length>0&&ls.every(function(l){return l.date&&l.date<GRACE_CUTOFF;});}
function dirRow(g){var mv=mvmLaunch(g),l=(g.launches||[])[0];
  return "<tr class=row data-name=\""+esc(g.name.toLowerCase())+"\"><td><a href=\"game-hub.html?g="+slug(g.name)+"\">"+esc(g.name)+"</a></td>"+
    "<td>"+(launchedAll(g)?"<span class=\"chip launched\">✓ Launched</span>":"<span class=\"chip stage\">"+esc(g.stage||"—")+"</span>")+"</td><td>"+esc(g.type||"—")+"</td>"+
    "<td class=mono>"+esc((g.apps||[]).join(", "))+"</td><td class=mono>"+(mv?esc(fmtDate(mv)):(l?"<span class=dim>"+esc(l.app+" "+fmtDate(l.date))+"</span>":"—"))+"</td>"+
    "<td>"+(g.launchHealth?"<span class="+(g.launchHealth.tone==="good"?"ok":g.launchHealth.tone==="warn"?"warn":"bad")+">"+esc(g.launchHealth.label||g.launchHealth.tone)+"</span>":"<span class=dim>—</span>")+"</td></tr>";
}
var DIR_HEAD="<tr><th>Game</th><th>Stage</th><th>Type</th><th>Apps</th><th>MVM launch</th><th>Health</th></tr>";
function directory(){
  // Active games sorted by MVM launch (no-MVM games follow, by earliest launch);
  // fully-launched games live in a collapsed section on top, newest launch first.
  var launched=DATA.games.filter(launchedAll).sort(function(a,b){
    var la=(a.launches||[]).map(function(x){return x.date;}).sort().pop()||"",lb=(b.launches||[]).map(function(x){return x.date;}).sort().pop()||"";
    return la<lb?1:la>lb?-1:a.name.localeCompare(b.name);});
  var rows=DATA.games.filter(function(g){return !launchedSettled(g);}).sort(function(a,b){
    var am=mvmLaunch(a),bm=mvmLaunch(b);
    if(am&&bm)return am<bm?-1:am>bm?1:a.name.localeCompare(b.name);
    if(am)return -1; if(bm)return 1;
    var ae=(a.launches[0]||{}).date||"9999",be=(b.launches[0]||{}).date||"9999";
    return ae<be?-1:ae>be?1:a.name.localeCompare(b.name);});
  var h="<h1>Game Hub</h1><div class=meta>"+DATA.games.length+" games · data as of "+esc(DATA.generatedAt.slice(0,16).replace("T"," "))+" UTC · refreshed nightly</div>";
  h+="<input id=q placeholder=\"Filter games…\" autofocus>";
  if(launched.length){
    h+="<details class=launchsec><summary>✓ Launched games <span class=lcount>"+launched.length+"</span></summary>"+
      "<table>"+DIR_HEAD+launched.map(dirRow).join("")+"</table></details>";
  }
  h+="<table>"+DIR_HEAD+rows.map(dirRow).join("")+"</table>";host.innerHTML=h;
  document.getElementById("q").addEventListener("input",function(){var v=this.value.toLowerCase();
    host.querySelectorAll("tr.row").forEach(function(r){r.style.display=r.getAttribute("data-name").indexOf(v)>-1?"":"none";});
    var ls=host.querySelector(".launchsec");if(ls&&v)ls.open=true;});
}
function block(label,a,b){if(!a&&!b)return"";return"<tr><td>"+esc(label)+"</td><td class=mono>"+esc(fmtDate(a)||"—")+"</td><td class=mono>"+esc(fmtDate(b)||"—")+"</td></tr>";}
function msSide(k){return /gear/i.test(k||"")?"gear":"ss";}
function game(g){
  var h="<h1>"+esc(g.name)+"</h1>";
  h+="<div class=meta style=\"margin-bottom:10px\">"+(launchedAll(g)?"<span class=\"chip launched\">✓ Launched everywhere</span>":"<span class=\"chip stage\">"+esc(g.stage||"—")+"</span>")+"<span class=chip>"+esc(g.type||"—")+"</span>"+(g.quarter?"<span class=chip>"+esc(g.quarter)+"</span>":"")+"<span class=chip>"+esc((g.apps||[]).join(" · "))+"</span></div>";
  if(g.notes)h+="<div class=card>"+esc(g.notes)+"</div>";
  var lk=g.links||{},lks=[];
  if(lk.gdd)lks.push("<a href=\""+esc(lk.gdd)+"\" target=_blank rel=noopener>GDD</a>");
  Object.keys(lk).forEach(function(k){if(k!=="gdd"&&lk[k])lks.push("<a href=\""+esc(lk[k])+"\" target=_blank rel=noopener>"+esc(k)+"</a>");});
  var ids=(g.slack&&g.slack.ids)||{};
  Object.keys(ids).forEach(function(k){if(ids[k])lks.push("<a href=\"https://slack.com/app_redirect?channel="+esc(ids[k])+"\" target=_blank rel=noopener>Slack ("+esc(k)+")</a>");});
  if(lks.length)h+="<div class=card>"+lks.join(" · ")+"</div>";
  if((g.triggers||[]).length){h+="<h2>Needs attention</h2>";g.triggers.forEach(function(t){var d=daysUntil(t.due);
    h+="<div class=trigger><b>"+esc(t.label)+"</b> — <span class=mono>"+esc(fmtDate(t.due))+"</span> "+fmtDelta(d)+"<div class=dim>"+esc(t.detail)+"</div></div>";});}
  h+="<div class=two><div><h2>Launches</h2><table><tr><th>App</th><th>Date</th><th>QA Complete</th><th>Buffer</th></tr>";
  (g.launches||[]).forEach(function(l){var f=(g.float||[]).filter(function(x){return x.app===l.app;})[0];var past=l.date&&l.date<DATA.today;
    h+="<tr><td>"+esc(l.app)+"</td><td class=mono>"+esc(fmtDate(l.date))+(past?" <span class=done>✓</span>":"")+"</td><td class=mono>"+esc(f?fmtDate(f.qaEnd):"—")+"</td><td>"+(past?"<span class=dim>launched</span>":f?fmtDelta(f.days):"<span class=dim>—</span>")+"</td></tr>";});
  h+="</table></div>";
  h+="<div>";
  if(g.blocks){h+="<h2>Schedule</h2><table><tr><th>Phase</th><th>Start</th><th>End</th></tr>";
    h+=block("GD",g.blocks.gdStart,g.blocks.gdEnd)+block("Art",g.blocks.artStart,g.blocks.artEnd)+
      block("BEE (SlotStudio)",g.blocks.beeStartA,g.blocks.beeEndA)+block("Client (SlotStudio)",g.blocks.clientStartA,g.blocks.clientEndA)+
      block("QA (SlotStudio)",g.blocks.qaStartA,g.blocks.qaEndA)+block("BEE (Gear)",g.blocks.beeStartB,g.blocks.beeEndB)+
      block("Client (Gear)",g.blocks.clientStartB,g.blocks.clientEndB)+block("QA (Gear)",g.blocks.qaStartB,g.blocks.qaEndB);
    h+="</table>";}
  h+="</div></div>";
  if(g.plan){var pl=g.plan;
    h+="<h2>Development plan <span style=\"font-weight:400;font-size:12px;color:var(--ink3)\">PlayStones · team "+esc(pl.team||"?")+" · plan as of "+esc(pl.updatedAt||"?")+"</span></h2>";
    if(pl.progress&&pl.progress.total)h+="<div class=meta>"+pl.progress.done+" of "+pl.progress.total+" work items done</div>";
    h+="<div class=scwrap><div class=scstrip>"+pl.showcases.map(function(sc){
      var loads=["TA","FEE","VFX"].filter(function(d){return sc.loads[d];}).map(function(d){return d+" "+sc.loads[d]+"d";}).join(" · ");
      var heads=sc.headlines.map(function(hd){return "<div class=schead>"+(hd.checked?"<span class=hdone>✓ </span>":"")+esc(hd.label)+"</div>";}).join("");
      var notes=sc.notes.length?"<div class=scload title=\""+esc(sc.notes.join(" · "))+"\">✎ note</div>":"";
      return "<div class=\"sccell"+(sc.closed?" closed":sc.reserved?" res":"")+"\"><div class=scn><span>SC"+sc.n+"</span><span>"+(sc.closed?"✓ closed":sc.reserved?"reserved":"")+"</span></div>"+heads+(loads?"<div class=scload>"+esc(loads)+"</div>":"")+notes+"</div>";
    }).join("")+"</div></div>";
    h+="<div class=scend><span>kickoff "+esc(fmtDate(pl.kickoff))+"</span><span>QA COMPLETE "+esc(fmtDate(pl.qaComplete))+"</span></div>";
    if(pl.decisions.length){h+="<h2>Needs a decision <span style=\"font-weight:400;font-size:12px;color:var(--ink3)\">from the plan</span></h2>";
      pl.decisions.forEach(function(d){h+="<div class=decision><b>"+esc(d.name)+"</b><div class=dim>"+esc(d.note)+"</div></div>";});}
  }
  if((g.milestones||[]).length){
    h+="<h2>Milestones</h2>";
    var discs=[];g.milestones.forEach(function(m){if(m.disc&&discs.indexOf(m.disc)<0)discs.push(m.disc);});
    h+="<div class=fbar><button class=\"fbtn on\" data-fside=\"all\">All</button><button class=fbtn data-fside=ss>SlotStudio</button><button class=fbtn data-fside=gear>Gear</button>"+
      "<span style=\"width:14px\"></span><button class=\"fbtn on\" data-fdisc=\"all\">All disciplines</button>"+
      discs.map(function(d){return "<button class=fbtn data-fdisc=\""+esc(d)+"\">"+esc(d)+"</button>";}).join("")+"</div>";
    h+="<table id=mstable><tr><th>Discipline</th><th>Milestone</th><th>Date</th><th></th></tr>";
    g.milestones.forEach(function(m){var late=!m.done&&m.date&&m.date<DATA.today;
      h+="<tr data-mside=\""+msSide(m.discKey)+"\" data-mdisc=\""+esc(m.disc)+"\"><td>"+esc(m.disc)+"</td><td>"+esc(m.label)+(m.overridden?" <span class=dim title=\"date manually set\">✎</span>":"")+"</td><td class=mono>"+esc(fmtDate(m.date)||"—")+"</td>"+
        "<td>"+(m.done?"<span class=done>✓ done</span>":late?"<span class=overdue>overdue</span>":"")+"</td></tr>";});
    h+="</table>";}
  h+="<h2>Team</h2><table>";
  var a=g.assignments||{};
  h+="<tr><td>GD</td><td>"+esc(a.gd||"—")+"</td></tr><tr><td>Artist</td><td>"+esc(a.artist||"—")+"</td></tr>";
  if(a.beeSlotStudio!==undefined)h+="<tr><td>BEE (SlotStudio)</td><td>"+esc(a.beeSlotStudio||"—")+"</td></tr>";
  if(a.beeGear!==undefined)h+="<tr><td>BEE (Gear)</td><td>"+esc(a.beeGear||"—")+"</td></tr>";
  [["clientTeamSlotStudio","Client team (SlotStudio)"],["clientTeamGear","Client team (Gear)"]].forEach(function(p){var t=a[p[0]];if(!t)return;
    h+="<tr><td>"+p[1]+"</td><td>"+esc(t.displayName)+(t.producer?" <span class=dim>· prod "+esc(t.producer)+"</span>":"")+"</td></tr>";});
  h+="</table>";
  var pit=(DATA.pitches[g.name]||[]);
  if(pit.length){h+="<h2>Pitches</h2>";var glHref="greenlight.html#subs:"+slug(g.name);
    pit.forEach(function(p){h+="<div class=card>"+esc(p.name)+" — "+(p.approved?"<span class=ok>approved</span>":p.sent?"sent for scoping":"draft")+" · <a href=\""+glHref+"\">scoping detail ↗</a></div>";});}
  host.innerHTML=h;
  // Milestone filters: side (SlotStudio/Gear) and discipline compose.
  var fside="all",fdisc="all";
  function applyMsFilter(){
    var t=document.getElementById("mstable");if(!t)return;
    t.querySelectorAll("tr[data-mside]").forEach(function(r){
      var okS=fside==="all"||r.getAttribute("data-mside")===fside;
      var okD=fdisc==="all"||r.getAttribute("data-mdisc")===fdisc;
      r.style.display=(okS&&okD)?"":"none";});
  }
  host.querySelectorAll(".fbtn").forEach(function(b){b.addEventListener("click",function(){
    if(b.hasAttribute("data-fside")){fside=b.getAttribute("data-fside");host.querySelectorAll("[data-fside]").forEach(function(x){x.classList.toggle("on",x===b);});}
    else{fdisc=b.getAttribute("data-fdisc");host.querySelectorAll("[data-fdisc]").forEach(function(x){x.classList.toggle("on",x===b);});}
    applyMsFilter();});});
}
if(param){var m=DATA.games.filter(function(g){return slug(g.name)===param;})[0];
  if(m)game(m);else{host.innerHTML="<h1>Not found</h1><div class=meta>No game matches “"+esc(param)+"” — <a href=game-hub.html>back to the directory</a>.</div>";}}
else directory();
var f=document.createElement("footer");f.textContent="Slot Studio · generated "+DATA.generatedAt+" · snapshot refreshed nightly (and on any manual publish)";
host.appendChild(f);
})();
</script></body></html>
